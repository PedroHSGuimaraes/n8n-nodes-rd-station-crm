name: Publish to npm

# Stages the package on npm (with a provenance statement) whenever a version
# tag (e.g. v2.0.0) is pushed; the owner approves it on npmjs.com. Provenance is mandatory for n8n verified nodes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Mesma versão do ci.yml: o `npm ci` só aceita o lock gerado pelo mesmo npm.
          # Com Node 20 (npm 10) a tag v2.4.0 falhou com "Missing: ignore@7.0.14 from lock file".
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        # --ignore-scripts skips native builds (e.g. isolated-vm from n8n-workflow),
        # which aren't needed to compile/publish this node.
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # O token NPM_TOKEN é granular "Read and write (stage only)" (decisão do dono, 06/11/2026):
      # com ele `npm publish` falha com E_STAGE_REQUIRED. A versão vai para a fila de espera e o dono
      # a aprova com 2FA na aba Staged Packages do npmjs.com.
      # `npm stage` só existe no npm 12; o Node LTS do runner traz o npm 11, por isso o npx fixa a versão.
      # Este pacote não tem `prepublishOnly: n8n-node prerelease`, então não precisa de RELEASE_MODE.
      - name: Stage package for approval (with provenance)
        run: npx -y npm@12.2.2 stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
